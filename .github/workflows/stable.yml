name: stable
on:
  push:
    branches:
      - 'stable-*'

permissions:
  contents: write

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Build
        run: |
          gradle build --no-daemon --console=plain
      - name: Publish a fixed copy as a release named after the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/pvpduels-*.jar | grep -v sources | head -1)
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" "$JAR" --target "${GITHUB_SHA}" --title "PvP Duels - ${GITHUB_REF_NAME} (fixed copy)" --notes "Fixed copy of the mod at this point. It never changes, so it is a safe fallback if a newer build has a problem."
