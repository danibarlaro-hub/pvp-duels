name: world
# Builds the lobby island into a fresh void world and publishes it as a ready-to-use world folder (zip),
# together with the mod. Runs when a branch called world-<something> is pushed.
on:
  push:
    branches:
      - 'world-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Prepare the server folder (a void world)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf '%s\n' "online-mode=false" "spawn-protection=0" "view-distance=6" "simulation-distance=6" \
            "max-tick-time=-1" "spawn-monsters=false" "spawn-animals=false" "spawn-npcs=false" \
            "generate-structures=false" "allow-nether=false" "enable-command-block=false" "gamemode=survival" "difficulty=normal" \
            "level-name=PvP Duels Lobby" "level-type=minecraft\\:flat" \
            'generator-settings={"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void","features":false,"lakes":false,"structure_overrides":[]}' \
            > run/server.properties
          cat run/server.properties
      - name: Build the island into the world
        run: |
          PVPDUELS_BUILDWORLD=1 timeout 1500 gradle runServer --no-daemon --console=plain > world.log 2>&1 || true
          ls -la run run/"PvP Duels Lobby" || true
          cat run/worldgen-report.txt || echo "no report"
      - name: Build the mod jar
        run: gradle build --no-daemon --console=plain
      - name: Make the world zip
        run: |
          pip install nbtlib > /dev/null
          W="run/PvP Duels Lobby"
          python3 - "$W/level.dat" <<'PY'
          import sys, nbtlib
          f = nbtlib.load(sys.argv[1])
          data = f['Data']
          print("level.dat keys:", sorted(data.keys()))
          data['allowCommands'] = nbtlib.Byte(1)
          f.save()
          print("allowCommands set")
          PY
          rm -f "$W/session.lock"
          rm -rf "$W/playerdata" "$W/stats" "$W/advancements" "$W/logs"
          mkdir -p dist
          (cd run && zip -qr ../dist/PvP-Duels-Lobby-world.zip "PvP Duels Lobby")
          cp build/libs/pvpduels-*.jar dist/ && rm -f dist/*-sources.jar
          ls -la dist
          unzip -l dist/PvP-Duels-Lobby-world.zip | tail -30
      - name: Publish the report and the logs to the world-out branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp run/worldgen-report.txt /tmp/pub/ 2>/dev/null || echo "no report" > /tmp/pub/worldgen-report.txt
          cp run/logs/latest.log /tmp/pub/server-latest.log 2>/dev/null || true
          tail -200 world.log > /tmp/pub/world-tail.log || true
          cp run/server.properties /tmp/pub/ 2>/dev/null || true
          (cd run && find "PvP Duels Lobby" -maxdepth 2 | sort | head -80) > /tmp/pub/world-files.txt 2>/dev/null || true
          (cd run && du -sh "PvP Duels Lobby" >> /tmp/pub/world-files.txt) 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/pub/commit.txt
          cd /tmp/pub
          git init -q -b world-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "world results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" world-out
      - name: Publish the world and the mod as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q "RESULT: OK" run/worldgen-report.txt || { echo "The island was not built correctly, not publishing"; exit 1; }
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          gh release create "${GITHUB_REF_NAME}" dist/* --target "${GITHUB_SHA}" --title "PvP Duels lobby world - ${GITHUB_REF_NAME}" \
            --notes "A void world with a big floating green island (village, mountains, waterfall) and the PvP Duels mod. Unzip the world into your saves folder."
