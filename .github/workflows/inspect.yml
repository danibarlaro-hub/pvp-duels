name: inspect
on:
  workflow_dispatch:
  push:
    paths:
      - 'inspect/**'
      - '.github/workflows/inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Resolve the Minecraft jars
        run: gradle build --no-daemon --console=plain > build.log 2>&1 || true
      - name: Inspect
        run: bash inspect/run.sh || true
      - name: Publish the results to the inspect-out branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp -r inspect-out/. /tmp/pub/ || true
          tail -60 build.log > /tmp/pub/build-tail.txt || true
          cd /tmp/pub
          git init -q -b inspect-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "inspect results"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" inspect-out
